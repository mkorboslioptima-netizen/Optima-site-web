  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#007a55" />

    <!--
      SEO : les balises title, description, canonical, Open Graph et Twitter
      sont gérées PAR PAGE via le composant src/components/SEO.js (react-helmet-async)
      et figées dans le HTML par le pré-rendu (scripts/prerender.js).
      Ne pas remettre de canonical ou og:url en dur ici : la même valeur serait
      servie pour toutes les URLs et Google dédupliquerait tout vers l'accueil.
    -->
    <title>Optima | Intégrateur Sage 100 & Solutions de Gestion</title>
    <meta name="author" content="Optima" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- Favicon & App Icons -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Google Analytics (page_view envoyé manuellement à chaque route, voir App.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QJ7CP61KR9"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-QJ7CP61KR9', { send_page_view: false });
    </script>
  </head>
  <body>
    <noscript>Vous devez activer JavaScript pour utiliser cette application.</noscript>
    <div id="root"></div>
  </body>
</html>
